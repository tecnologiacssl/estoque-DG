<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Wi-Fi · Casa de Saúde Santa Lúcia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --azul:#4c6ff2;
  --azul-forte:#3355d8;
  --azul-claro:#82a0ff;
  --branco:#ffffff;
  --cinza-claro:#a6a6ac;
  --cinza-medio:#72727a;
  --preto:#050505;
  --borda:rgba(161,161,170,.18);
  --verde:#22c55e;
  --amarelo:#f59e0b;
  --vermelho:#f87171;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Manrope","Segoe UI",Arial,sans-serif;background:var(--preto);color:var(--branco);
  min-height:100vh;display:flex;flex-direction:column;
}
.topo{
  padding:28px 20px 18px;text-align:center;
  background:radial-gradient(480px 220px at 50% -40%,rgba(76,111,242,.22),transparent 70%);
}
.topo .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--azul-forte),var(--azul));box-shadow:0 10px 26px -10px rgba(76,111,242,.6)}
.topo h1{margin:0;font-size:19px;font-weight:800}
.topo p{margin:6px 0 0;font-size:13px;color:var(--cinza-claro)}

.conteudo{flex:1;max-width:480px;width:100%;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}

.carregando{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 20px;color:var(--cinza-claro);font-size:13.5px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--azul-claro);animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

.vazio{text-align:center;padding:50px 16px;color:var(--cinza-claro)}
.vazio .ico{font-size:34px;margin-bottom:10px}
.vazio b{display:block;color:#fff;font-size:15px;margin-bottom:4px}
.vazio p{margin:0;font-size:13px;line-height:1.5}

/* ---- Menu de andares ---- */
.andares-titulo{font-size:13px;color:var(--cinza-claro);margin:4px 2px 0;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.andar-btn{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px 16px;border-radius:14px;
  background:rgba(255,255,255,.035);border:1px solid var(--borda);color:#fff;cursor:pointer;
  font-family:inherit;text-align:left;transition:background .15s ease,border-color .15s ease,transform .1s ease;
}
.andar-btn:active{transform:scale(.98)}
.andar-btn:hover{background:rgba(76,111,242,.1);border-color:rgba(129,140,248,.4)}
.andar-btn .ico{flex-shrink:0;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(76,111,242,.14)}
.andar-btn .txt{flex:1;min-width:0}
.andar-btn .txt b{display:block;font-size:15px}
.andar-btn .txt span{display:block;font-size:12px;color:var(--cinza-claro);margin-top:2px}
.andar-btn .seta{color:var(--cinza-claro);font-size:18px;flex-shrink:0}

/* ---- Lista de redes de um andar ---- */
.voltar-btn{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:9px 14px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--borda);color:#fff;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;
}
.voltar-btn:hover{background:rgba(255,255,255,.08)}
.andar-atual{font-size:15px;font-weight:800;margin:2px 2px 0}

.rede-card{
  padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--borda);
}
.rede-nome{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.rede-nome .ponto{width:8px;height:8px;border-radius:50%;background:var(--verde);flex-shrink:0}
.rede-senha-linha{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border-radius:10px;padding:11px 13px}
.rede-senha{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rede-btns{display:flex;gap:8px;margin-top:12px}
.rede-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.06);
  border:1px solid var(--borda);
}
.rede-btn:hover{background:rgba(255,255,255,.1)}
.rede-btn.principal{background:linear-gradient(135deg,var(--azul-forte),var(--azul));border-color:transparent}

/* ---- Modal de QR ---- */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.modal-overlay.aberto{opacity:1;pointer-events:auto}
.modal-box{
  max-width:320px;width:100%;background:#0d0d0f;border:1px solid var(--borda);border-radius:18px;padding:24px;text-align:center;
  transform:scale(.92);transition:transform .25s ease;
}
.modal-overlay.aberto .modal-box{transform:scale(1)}
.modal-box h3{margin:0 0 4px;font-size:16px}
.modal-box p{margin:0 0 16px;font-size:12.5px;color:var(--cinza-claro);line-height:1.5}
.qr-holder{display:flex;justify-content:center;margin-bottom:16px}
.qr-holder img,.qr-holder canvas{border-radius:10px;background:#fff;padding:10px}
.modal-fechar{width:100%;padding:11px;border-radius:10px;border:none;background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}

.rodape{text-align:center;padding:18px 16px 28px;font-size:11.5px;color:var(--cinza-medio)}

.toast-wrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#17171b;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid var(--borda);opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease;box-shadow:0 10px 26px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateY(0)}

/* ADIÇÃO: botão "Imprimir" — fica FORA de #conteudo (que é trocado
   por inteiro a cada tela) pra não sumir ao trocar de andar/tela; só
   aparece depois que pelo menos uma rede pública carregou com sucesso. */
.acoes-globais{max-width:480px;width:100%;margin:0 auto;padding:0 16px 6px;display:none}
.btn-word{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--borda);color:#fff;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;
}
.btn-word:hover{background:rgba(255,255,255,.09)}
.btn-word:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">📶</div>
  <h1>Wi-Fi · Casa de Saúde Santa Lúcia</h1>
  <p>Rede e senha do Wi-Fi por andar, sem precisar de login.</p>
</div>

<div class="conteudo" id="conteudo">
  <div class="carregando" id="carregando">
    <div class="spin"></div>
    <span>Carregando redes disponíveis...</span>
  </div>
</div>

<div class="acoes-globais" id="acoes-globais">
  <button type="button" class="btn-word" id="btn-imprimir">🖨️ Imprimir cartões de todos os andares</button>
</div>

<div class="modal-overlay" id="modal-qr">
  <div class="modal-box">
    <h3>📶 Conectar no Wi-Fi</h3>
    <p id="qr-nome-rede">Aponte a câmera do celular pra este código — ele já oferece a opção de entrar na rede, sem digitar senha.</p>
    <div class="qr-holder" id="qr-holder"></div>
    <button type="button" class="modal-fechar" id="qr-fechar">Fechar</button>
  </div>
</div>

<div class="rodape">Casa de Saúde Santa Lúcia — Central de TI</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  'use strict';

  // Mesmo projeto/chave pública já usados no portal principal — a chave
  // "anon" do Supabase é feita pra ir no navegador (não é secreta), então
  // não tem problema repetir ela aqui numa página sem login.
  var SUPABASE_URL = "https://qahkmnaqlaocbduuiuac.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhaGttbmFxbGFvY2JkdXVpdWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTYwMzcsImV4cCI6MjEwMDEzMjAzN30.f_x08PNmXU3_ye2wrwpO-WmMpNnTwbqoSlwrLg7xXsU";

  // ADIÇÃO: só lê a "vitrine" pública (view wifi_redes_publica) — nome,
  // andar e senha das redes que o admin marcou como "visível para
  // visitantes" no formulário de Wi-Fi do portal. Ver sql_criar_wifi_publico.sql.
  var db = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  var conteudoEl = document.getElementById('conteudo');
  var modalQr = document.getElementById('modal-qr');
  var qrHolder = document.getElementById('qr-holder');
  var qrNomeRede = document.getElementById('qr-nome-rede');
  var btnQrFechar = document.getElementById('qr-fechar');
  // ADIÇÃO: guarda os dados já carregados (agrupados por andar) pra poder
  // gerar o Word a qualquer momento, sem precisar consultar o Supabase de
  // novo — ver "Exportar para Word" mais abaixo.
  var acoesGlobaisEl = document.getElementById('acoes-globais');
  var btnImprimir = document.getElementById('btn-imprimir');
  var porAndarCarregado = null;
  var andarAtual = null;   // null = menu de andares (imprime todos); senão só este andar
  function atualizarBotaoImprimir(){
    if(!btnImprimir) return;
    btnImprimir.textContent = andarAtual ? '🖨️ Imprimir cartões do ' + andarAtual : '🖨️ Imprimir cartões de todos os andares';
  }

  // ---- Ordem preferida dos andares (bate com o cadastro do admin);
  // qualquer valor fora dessa lista aparece depois, em ordem alfabética. ----
  var ORDEM_ANDARES = ['Térreo', '1º Andar', '2º Andar', '3º Andar'];

  function esc(v){
    if(v === undefined || v === null) return '';
    return String(v).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }

  function toast(msg, tipo){
    var wrap = document.getElementById('toastWrap');
    if(!wrap) return;
    var el = document.createElement('div');
    el.className = 'toast' + (tipo ? ' ' + tipo : '');
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){
      el.classList.remove('show');
      setTimeout(function(){ el.remove(); }, 300);
    }, 2800);
  }

  function escQR(v){
    return String(v === undefined || v === null ? '' : v).replace(/([\\;,:"])/g, '\\$1');
  }
  function conteudoQR(rede){
    return 'WIFI:T:WPA;S:' + escQR(rede.nome) + ';P:' + escQR(rede.senha) + ';;';
  }
  function abrirModalQr(rede){
    qrNomeRede.textContent = 'Rede: ' + rede.nome + ' — aponte a câmera do celular pro código.';
    qrHolder.innerHTML = '';
    if(window.QRCode){
      new QRCode(qrHolder, {
        text: conteudoQR(rede), width: 190, height: 190,
        colorDark: '#0f1b3d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      qrHolder.innerHTML = '<div style="padding:20px;color:var(--cinza-claro);font-size:12.5px">Não foi possível gerar o QR agora — mostre a senha manualmente.</div>';
    }
    modalQr.classList.add('aberto');
  }
  function fecharModalQr(){ modalQr.classList.remove('aberto'); }
  btnQrFechar.addEventListener('click', fecharModalQr);
  modalQr.addEventListener('click', function(e){ if(e.target === modalQr) fecharModalQr(); });

  function ordenarAndares(andares){
    return andares.slice().sort(function(a, b){
      var ia = ORDEM_ANDARES.indexOf(a), ib = ORDEM_ANDARES.indexOf(b);
      if(ia === -1 && ib === -1) return a.localeCompare(b, 'pt-BR');
      if(ia === -1) return 1;
      if(ib === -1) return -1;
      return ia - ib;
    });
  }

  function icone(andar){
    if(/térreo/i.test(andar)) return '🏢';
    return '🏬';
  }

  function renderErro(){
    conteudoEl.innerHTML =
      '<div class="vazio"><div class="ico">⚠️</div><b>Não foi possível carregar agora</b>' +
      '<p>Verifique sua conexão com a internet e tente novamente em instantes.</p></div>';
  }

  function renderVazio(){
    conteudoEl.innerHTML =
      '<div class="vazio"><div class="ico">📶</div><b>Nenhuma rede pública cadastrada ainda</b>' +
      '<p>Peça informações na recepção do seu andar.</p></div>';
  }

  function renderMenuAndares(porAndar){
    andarAtual = null; atualizarBotaoImprimir();
    var andares = ordenarAndares(Object.keys(porAndar));
    var html = '<div class="andares-titulo">Escolha o andar</div>';
    html += andares.map(function(andar){
      var qtd = porAndar[andar].length;
      return '<button type="button" class="andar-btn" data-andar="' + esc(andar) + '">' +
        '<div class="ico">' + icone(andar) + '</div>' +
        '<div class="txt"><b>' + esc(andar) + '</b><span>' + qtd + (qtd === 1 ? ' rede disponível' : ' redes disponíveis') + '</span></div>' +
        '<div class="seta">›</div>' +
      '</button>';
    }).join('');
    conteudoEl.innerHTML = html;
    conteudoEl.querySelectorAll('[data-andar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        renderRedesDoAndar(btn.getAttribute('data-andar'), porAndar[btn.getAttribute('data-andar')], porAndar);
      });
    });
  }

  function renderRedesDoAndar(andar, redes, porAndar){
    andarAtual = andar; atualizarBotaoImprimir();
    var html = '<button type="button" class="voltar-btn" id="btn-voltar-andares">‹ Trocar de andar</button>';
    html += '<div class="andar-atual">' + icone(andar) + ' ' + esc(andar) + '</div>';
    html += redes.map(function(r){
      return '<div class="rede-card">' +
        '<div class="rede-nome"><span class="ponto"></span>' + esc(r.nome) + '</div>' +
        '<div class="rede-senha-linha">' +
          '<span class="rede-senha" data-senha-de="' + esc(r.nome) + '" data-visivel="0">••••••••</span>' +
        '</div>' +
        '<div class="rede-btns">' +
          '<button type="button" class="rede-btn" data-mostrar="' + esc(r.nome) + '">Mostrar</button>' +
          '<button type="button" class="rede-btn" data-copiar="' + esc(r.nome) + '">Copiar</button>' +
          '<button type="button" class="rede-btn principal" data-conectar="' + esc(r.nome) + '">Conectar</button>' +
        '</div>' +
      '</div>';
    }).join('');
    conteudoEl.innerHTML = html;

    document.getElementById('btn-voltar-andares').addEventListener('click', function(){
      renderMenuAndares(porAndar);
    });
    conteudoEl.querySelectorAll('[data-mostrar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var nome = btn.getAttribute('data-mostrar');
        var r = redes.find(function(x){ return x.nome === nome; });
        if(!r) return;
        var span = conteudoEl.querySelector('.rede-senha[data-senha-de="' + CSS.escape(nome) + '"]');
        if(!span) return;
        var visivel = span.getAttribute('data-visivel') === '1';
        span.textContent = visivel ? '••••••••' : r.senha;
        span.setAttribute('data-visivel', visivel ? '0' : '1');
        btn.textContent = visivel ? 'Mostrar' : 'Ocultar';
      });
    });
    conteudoEl.querySelectorAll('[data-copiar]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var nome = btn.getAttribute('data-copiar');
        var r = redes.find(function(x){ return x.nome === nome; });
        if(!r) return;
        try{
          await navigator.clipboard.writeText(r.senha || '');
          toast('Senha copiada!');
        }catch(e){
          toast('Não foi possível copiar — mostre a senha e digite manualmente.');
        }
      });
    });
    conteudoEl.querySelectorAll('[data-conectar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var nome = btn.getAttribute('data-conectar');
        var r = redes.find(function(x){ return x.nome === nome; });
        if(r) abrirModalQr(r);
      });
    });
  }

  // ALTERADO: em vez de baixar um Word, imprime direto (uma folha por
  // andar, cartões em 2 colunas para recortar). No menu de andares imprime
  // todos; dentro de um andar, só aquele andar. Ver csslImprimirWifi.
  if(btnImprimir){
    btnImprimir.addEventListener('click', function(){
      if(!porAndarCarregado || !Object.keys(porAndarCarregado).length){ toast('Nenhuma rede pública carregada ainda.'); return; }
      var lista = andarAtual ? [andarAtual] : ordenarAndares(Object.keys(porAndarCarregado));
      if(!window.csslImprimirWifi(porAndarCarregado, lista)) toast('Nada para imprimir neste andar.');
    });
  }

  async function iniciar(){
    if(!db){
      renderErro();
      return;
    }
    try{
      // ALTERADO: as senhas do Wi-Fi ficaram protegidas no banco; as redes
      // públicas vêm por uma função própria (wifi_redes_publicas). Se ela
      // ainda não existir, usa a visão antiga.
      var resp = await db.rpc('wifi_redes_publicas');
      if(resp.error) resp = await db.from('wifi_redes_publica').select('nome,andar,senha').order('andar', { ascending:true });
      if(resp.error){ console.error(resp.error); renderErro(); return; }
      var linhas = (resp.data || []).filter(function(r){ return r.andar; });
      if(!linhas.length){ renderVazio(); return; }
      var porAndar = {};
      linhas.forEach(function(r){
        if(!porAndar[r.andar]) porAndar[r.andar] = [];
        porAndar[r.andar].push(r);
      });
      var andares = Object.keys(porAndar);
      if(andares.length === 1){
        renderRedesDoAndar(andares[0], porAndar[andares[0]], porAndar);
      } else {
        renderMenuAndares(porAndar);
      }
      // ADIÇÃO: dados carregados com sucesso — guarda pro botão de Word e
      // revela o botão (fica escondido em erro/vazio).
      porAndarCarregado = porAndar;
      if(acoesGlobaisEl) acoesGlobaisEl.style.display = 'block';
    }catch(e){
      console.error(e);
      renderErro();
    }
  }

  iniciar();
})();
</script>
<style>
/* ADIÇÃO: impressão direta dos cartõezinhos de Wi-Fi (sem baixar Word).
   Uma folha A4 por andar, cartões em 2 colunas para recortar. */
#wifi-print-host{display:none}
@media print{
  body.wifi-imprimindo > *:not(#wifi-print-host){display:none !important}
  body.wifi-imprimindo{background:#fff !important;min-height:0 !important;display:block !important}
  body.wifi-imprimindo #wifi-print-host{display:block !important}
  @page{size:A4 portrait;margin:10mm}
}
#wifi-print-host .wp-pagina{break-after:page;page-break-after:always;height:276mm;overflow:hidden}
#wifi-print-host .wp-pagina:last-child{break-after:auto;page-break-after:auto}
#wifi-print-host .wp-grade{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;row-gap:5mm;align-content:start}
#wifi-print-host .wp-cartao{width:100%;border-collapse:collapse;table-layout:fixed;break-inside:avoid;page-break-inside:avoid;font-family:Calibri,Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#wifi-print-host .wp-cartao th{height:8mm;padding:0 2mm;background:#1F3864;color:#fff;font-size:9.5pt;font-weight:700;text-align:center;letter-spacing:.04em;border:.3mm solid #B7C6DB;white-space:nowrap;overflow:hidden}
#wifi-print-host .wp-cartao td{height:7mm;padding:0 2mm;border:.3mm solid #B7C6DB;background:#fff;font-size:9pt;white-space:nowrap;overflow:hidden;vertical-align:middle}
#wifi-print-host .wp-cartao tr.wp-azul td{background:#DCE6F1}
#wifi-print-host .wp-cartao td.wp-nome{width:56%;font-weight:700}
#wifi-print-host .wp-cartao *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
<script>
/* ADIÇÃO: monta e imprime os cartões de Wi-Fi.
   window.csslImprimirWifi({ "Térreo": [{nome, senha}], "1º andar": [...] })
   → uma página por andar (só os andares passados). */
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  // fonte menor para texto comprido, para nunca cortar a senha
  function tam(txt, base, cabe){ var n = String(txt || '').length; return n <= cabe ? base : Math.max(6, Math.round(base * cabe / n * 10) / 10); }
  function cartao(andar, redes){
    var h = '<table class="wp-cartao"><tr><th colspan="2" style="font-size:' + tam(andar, 9.5, 30) + 'pt">' + esc(String(andar).toUpperCase()) + '</th></tr>';
    redes.forEach(function(r, i){
      h += '<tr' + (i % 2 === 0 ? ' class="wp-azul"' : '') + '><td class="wp-nome" style="font-size:' + tam(r.nome, 9, 24) + 'pt">' + esc(r.nome) + '</td>' +
        '<td style="font-size:' + tam(r.senha, 9, 18) + 'pt">' + esc(r.senha) + '</td></tr>';
    });
    return h + '</table>';
  }
  function copiasPorPagina(n){
    var alturaCartao = 8 + 7 * n + 1;               // mm
    var linhas = Math.floor((276 + 5) / (alturaCartao + 5));
    return Math.max(1, Math.min(linhas, 14)) * 2;   // 2 colunas
  }
  window.csslImprimirWifi = function(porAndar, ordem){
    var andares = (ordem || Object.keys(porAndar)).filter(function(a){ return porAndar[a] && porAndar[a].length; });
    if(!andares.length) return false;
    var host = document.getElementById('wifi-print-host');
    if(!host){ host = document.createElement('div'); host.id = 'wifi-print-host'; document.body.appendChild(host); }
    host.innerHTML = andares.map(function(andar){
      var redes = porAndar[andar], c = cartao(andar, redes), n = copiasPorPagina(redes.length), g = '';
      for(var i = 0; i < n; i++) g += c;
      return '<section class="wp-pagina"><div class="wp-grade">' + g + '</div></section>';
    }).join('');
    document.body.classList.add('wifi-imprimindo');
    var limpar = function(){ document.body.classList.remove('wifi-imprimindo'); window.removeEventListener('afterprint', limpar); };
    window.addEventListener('afterprint', limpar);
    setTimeout(function(){ window.print(); }, 60);  // a classe só vale na impressão (@media print)
    return true;
  };
})();
</script>
</body>
